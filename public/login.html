<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Certificate Chain</title>
    <meta name="description" content="Access your digital certificates registered on the blockchain.">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d9488 0%, #0891b2 50%, #0e7490 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: flex-start;
        }

        .nav-logo {
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .login-card {
            background: linear-gradient(180deg, #a855f7 0%, #ec4899 50%, #f97316 100%);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-field {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-field input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-field input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-field input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.25);
        }

        .login-btn {
            width: 100%;
            padding: 1.1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(249, 115, 22, 0.5);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .admin-link {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .admin-link a {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .admin-link a:hover {
            color: white;
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <span class="nav-logo">Certificate Chain</span>
    </div>

    <div class="login-card animate-fade">
        <h1 class="login-title">Student Portal Login</h1>
        <p class="login-subtitle">Access your digital certificates registered on the blockchain.</p>

        <form id="loginForm">
            <div class="form-field">
                <label>Roll Number</label>
                <input type="text" id="rollNumber" placeholder="Enter your unique Roll Number" required>
            </div>
            <div class="form-field">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>

        <div class="admin-link">
            <a href="/admin-login.html">Are you an Admin? Click here.</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();

            const rollNumber = document.getElementById('rollNumber').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.innerText = 'Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNumber, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    if (data.user.role === 'admin') {
                        location.href = '/admin/index.html';
                    } else if (data.user.role === 'student') {
                        location.href = '/student/index.html';
                    } else {
                        location.href = '/';
                    }
                } else {
                    alert(data.error || 'Login failed. Please check your credentials.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection failure. Please try again.');
            } finally {
                btn.innerText = 'Sign In';
                btn.disabled = false;
            }
        };
    </script>
</body>

</html>
