<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Certificate Chain</title>
    <meta name="description" content="View and manage your digital certificates.">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0d9488 0%, #0891b2 50%, #0e7490 100%);
            min-height: 100vh;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            color: white;
        }

        .nav-title {
            font-weight: 800;
            font-size: 1.3rem;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info {
            font-weight: 600;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .logout-btn {
            padding: 0.6rem 1.5rem;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .section-title {
            color: #22d3ee;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .cert-card {
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.4) 0%, rgba(168, 85, 247, 0.3) 50%, rgba(236, 72, 153, 0.3) 100%);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            position: relative;
        }

        .cert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .cert-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.25rem;
        }

        .cert-dept {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .valid-badge {
            padding: 0.4rem 1rem;
            background: #22c55e;
            color: white;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .cert-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2rem;
        }

        .detail-value {
            font-size: 0.95rem;
            color: white;
            font-weight: 700;
        }

        .hash-value {
            font-family: monospace;
            font-size: 0.8rem;
            color: #f472b6;
            word-break: break-all;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .action-btn {
            padding: 0.9rem 1rem;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .action-btn.pdf {
            background: white;
            color: #333;
        }

        .action-btn.photo {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .action-btn.qr {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        footer {
            text-align: center;
            padding: 3rem 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        /* PDF Template (hidden) */
        .pdf-template {
            position: absolute;
            left: -9999px;
            width: 800px;
            padding: 50px;
            background: linear-gradient(-45deg, #064e3b, #065f46, #047857, #10b981);
            color: white;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }

        .pdf-template .border {
            border: 8px solid rgba(255, 255, 255, 0.2);
            padding: 50px;
            border-radius: 24px;
        }

        /* Toggle Switch Styles */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #22d3ee;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #22d3ee;
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        .slider.round {
            border-radius: 34px;
        }

        .slider.round:before {
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="nav-header">
        <span class="nav-title">My Digital Certificates</span>
        <div class="nav-right">
            <span class="user-info" id="userInfo"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container animate-fade">
        <h2 class="section-title">Issued Certificates</h2>

        <div id="certList">
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>Loading your certificates...</p>
            </div>
        </div>
    </div>

    <footer>
        © 2025 Certificate Chain | Secure Student Portal
    </footer>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        const token = localStorage.getItem('token');

        if (!user || user.role !== 'student') {
            location.href = '/login.html';
        }

        document.getElementById('userInfo').innerText = `${user.name} | ${user.rollNumber || user.email}`;

        async function loadCertificates() {
            try {
                const res = await fetch(`/api/certificates/student/${user.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const certs = await res.json();

                const container = document.getElementById('certList');

                if (!certs.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📜</div>
                            <h3 style="color: white; margin-bottom: 0.5rem;">No Certificates Yet</h3>
                            <p>Your university hasn't issued any blockchain credentials to your profile yet.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = certs.map((cert, index) => `
                    <div class="cert-card animate-fade" style="animation-delay: ${index * 0.1}s;">
                        <div class="cert-header">
                            <div>
                                <div class="cert-name">${user.name}</div>
                                <div class="cert-dept">${cert.department || user.department || 'N/A'} - Class of ${cert.year || new Date(cert.issueDate).getFullYear()}</div>
                            </div>
                            <span class="valid-badge">${cert.status === 'approved' ? 'VALID' : cert.status?.toUpperCase() || 'VALID'}</span>
                        </div>

                        <div class="cert-details">
                            <div class="detail-item">
                                <span class="detail-label">Result Class:</span>
                                <span class="detail-value">${cert.grade || cert.finalGrade || 'First Class with Distinction'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Percentage/CGPA:</span>
                                <span class="detail-value">${cert.cgpa || '8.0'}</span>
                            </div>
                        </div>

                        <div class="detail-item" style="margin-bottom: 1.5rem;">
                            <span class="detail-label">Certificate Hash:</span>
                            <span class="hash-value">${cert.txHash || cert.certificateId || 'Pending...'}</span>
                        </div>

                        <!-- Sovereign Era: Selective Disclosure Toggle -->
                        <div style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="font-weight: 800; color: #22d3ee; font-size: 0.8rem; text-transform: uppercase;">Privacy Mode (Selective Disclosure)</div>
                                <div style="font-size: 0.75rem; color: rgba(255,255,255,0.6);">Hide sensitive details during public verification</div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" ${cert.isPrivate ? 'checked' : ''} onchange="togglePrivacy('${cert._id}', this.checked)">
                                <span class="slider round"></span>
                            </label>
                        </div>

                        <div class="action-buttons">
                            <button class="action-btn pdf" onclick="downloadPDF('${cert._id}', '${cert.courseName}')">PDF</button>
                            <a href="${cert.photoUrl || '/api/certificates/photo/' + cert._id}" target="_blank" class="action-btn photo">Photo</a>
                            <button class="action-btn qr" onclick="showQR('${cert.qrCode}', '${cert.certificateId}')">QR Code</button>
                        </div>

                        <!-- Hidden PDF Template -->
                        <div id="pdf-${cert._id}" class="pdf-template">
                            <div class="border">
                                <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">CERTIFICATE OF ACHIEVEMENT</h1>
                                <p style="font-size: 1.2rem; opacity: 0.8; margin-bottom: 2rem;">This is to certify that</p>
                                <h2 style="font-size: 2.2rem; margin-bottom: 1rem; font-weight: 900;">${user.name}</h2>
                                <p style="font-size: 1.1rem; margin-bottom: 2rem;">has successfully completed</p>
                                <h2 style="font-size: 1.8rem; color: #fbbf24; margin-bottom: 2rem;">${cert.courseName || 'Bachelor of Technology'}</h2>
                                <p style="margin-bottom: 1rem;">${cert.university || 'IEEE University'}</p>
                                <div style="display: flex; justify-content: center; margin-top: 2rem;">
                                    <div style="background: white; padding: 15px; border-radius: 12px;">
                                        <img src="${cert.qrCode}" style="width: 120px; height: 120px;">
                                    </div>
                                </div>
                                <div style="margin-top: 2rem; font-size: 0.75rem; opacity: 0.6; text-align: left;">
                                    <p>Certificate ID: ${cert.certificateId}</p>
                                    <p>Transaction: ${cert.txHash || 'N/A'}</p>
                                    <p>Issued: ${new Date(cert.issueDate).toLocaleDateString()}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('certList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <h3 style="color: #ef4444; margin-bottom: 0.5rem;">Connection Error</h3>
                        <p>Unable to load certificates. Please try again.</p>
                        <button onclick="loadCertificates()" class="action-btn pdf" style="margin-top: 1rem; display: inline-block;">Retry</button>
                    </div>
                `;
            }
        }

        async function downloadPDF(certId, courseName) {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById(`pdf-${certId}`);

            try {
                const canvas = await html2canvas(element, { scale: 2 });
                const imgData = canvas.toDataURL('image/png');

                const pdf = new jsPDF('l', 'px', [canvas.width, canvas.height]);
                pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                pdf.save(`Certificate-${courseName || 'download'}.pdf`);
            } catch (err) {
                console.error('PDF generation error:', err);
                alert('Failed to generate PDF. Please try again.');
            }
        }

        function showQR(qrCode, certId) {
            if (!qrCode || qrCode === 'AWAITING_MINT') {
                alert('QR Code is not yet available. Certificate is pending approval.');
                return;
            }

            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999;';
            modal.onclick = () => modal.remove();

            modal.innerHTML = `
                <div style="background: white; padding: 2rem; border-radius: 20px; text-align: center;" onclick="event.stopPropagation()">
                    <img src="${qrCode}" style="width: 250px; height: 250px; display: block; margin-bottom: 1rem;">
                    <p style="color: #333; font-weight: 700; margin-bottom: 1rem;">${certId}</p>
                    <button onclick="this.parentElement.parentElement.remove()" style="padding: 0.75rem 2rem; background: #333; color: white; border: none; border-radius: 100px; font-weight: 700; cursor: pointer;">Close</button>
                </div>
            `;

            document.body.appendChild(modal);
        }

        async function togglePrivacy(certId, isPrivate) {
            try {
                const res = await fetch(`/api/certificates/privacy-toggle/${certId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await res.json();
                if (res.ok) {
                    console.log('Privacy toggled:', data.isPrivate);
                } else {
                    alert('Failed to update privacy settings: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Error toggling privacy');
            }
        }

        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            location.href = '/login.html';
        }

        loadCertificates();
    </script>
</body>

</html>
