<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student - Certificate Chain</title>
    <meta name="description" content="Register a new student in the Certificate Chain system.">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d9488 0%, #0891b2 50%, #0e7490 100%);
            min-height: 100vh;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            color: white;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-title {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .register-card {
            background: linear-gradient(180deg, #ec4899 0%, #f97316 50%, #eab308 100%);
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 700px;
            margin: 0 auto 2rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .register-title {
            font-size: 2rem;
            font-weight: 900;
            color: white;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-field {
            position: relative;
        }

        .form-field.full-width {
            grid-column: span 2;
        }

        .form-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-field input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-field input:focus,
        .form-field select:focus {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .form-field select option {
            background: #333;
            color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(6, 182, 212, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-field.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
    <div class="nav-header">
        <a href="/admin/index.html" class="nav-link">← Back to Dashboard</a>
        <span class="nav-title">New Student Registration</span>
    </div>

    <div class="container animate-fade" style="padding-top: 0;">
        <div class="register-card">
            <h1 class="register-title">Student Details</h1>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-field">
                        <label>Roll Number</label>
                        <input type="text" id="rollNumber" placeholder="ABC2424" required>
                    </div>
                    <div class="form-field">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="ramkumar2424@gmail.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field full-width">
                        <label>Temporary Password</label>
                        <input type="password" id="password" placeholder="••••" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field full-width">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Ram Kumar" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Department</label>
                        <input type="text" id="department" placeholder="CSE" required>
                    </div>
                    <div class="form-field">
                        <label>Year of Graduation</label>
                        <input type="number" id="year" placeholder="2024" min="2000" max="2100" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Final Grade</label>
                        <select id="finalGrade" required>
                            <option value="">Select Grade</option>
                            <option value="First Class with Distinction">First Class with Distinction</option>
                            <option value="First Class">First Class</option>
                            <option value="Second Class">Second Class</option>
                            <option value="Pass">Pass</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>CGPA / Percentage</label>
                        <input type="text" id="cgpa" placeholder="8.5 or 85%">
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Register Student Account
                </button>
            </form>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        const token = localStorage.getItem('token');

        if (!user || user.role !== 'admin') {
            location.href = '/login.html';
        }

        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Registering...';
            btn.disabled = true;

            const data = {
                rollNumber: document.getElementById('rollNumber').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                name: document.getElementById('name').value,
                department: document.getElementById('department').value,
                year: document.getElementById('year').value,
                finalGrade: document.getElementById('finalGrade').value,
                cgpa: document.getElementById('cgpa').value,
                role: 'student'
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    alert('Student registered successfully!');
                    location.href = '/admin/index.html';
                } else {
                    alert('Error: ' + (result.error || 'Registration failed'));
                }
            } catch (err) {
                console.error(err);
                alert('Connection failure. Please try again.');
            } finally {
                btn.innerText = 'Register Student Account';
                btn.disabled = false;
            }
        };
    </script>
</body>

</html>
