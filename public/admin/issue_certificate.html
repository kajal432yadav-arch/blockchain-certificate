<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Certificate - Certificate Chain</title>
    <meta name="description" content="Issue new blockchain certificates to students.">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d9488 0%, #0891b2 50%, #0e7490 100%);
            min-height: 100vh;
        }

        .issue-card {
            background: linear-gradient(180deg, #ec4899 0%, #f97316 50%, #eab308 100%);
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 700px;
            margin: 2rem auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .issue-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .issue-title {
            font-size: 2rem;
            font-weight: 900;
            color: white;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-field {
            position: relative;
        }

        .form-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-field input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-field input:focus,
        .form-field select:focus {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .form-field select option {
            background: #333;
            color: white;
        }

        /* Student dropdown with search */
        .student-dropdown {
            position: relative;
        }

        .student-search {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .student-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .student-list.show {
            display: block;
        }

        .student-list-header {
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            color: #666;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .student-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            color: #333;
            font-weight: 600;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .student-item:hover {
            background: #f5f5f5;
        }

        .student-item:last-child {
            border-bottom: none;
        }

        /* File upload */
        .file-field {
            margin-bottom: 1rem;
        }

        .file-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .file-btn {
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, #ec4899, #f97316);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .file-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .file-name {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(249, 115, 22, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            color: white;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-title {
            font-weight: 800;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="nav-header">
        <a href="/admin/index.html" class="nav-link">← Back to Dashboard</a>
        <span class="nav-title">Issue New Certificate</span>
    </div>

    <div class="container animate-fade" style="padding-top: 0;">
        <div class="issue-card">
            <h1 class="issue-title">Certificate Details</h1>

            <form id="issueForm">
                <div class="form-row">
                    <div class="form-field student-dropdown">
                        <label>Student Name</label>
                        <input type="text" id="studentSearch" class="student-search" placeholder="e.g., Jane Doe"
                            onclick="toggleStudentList()" oninput="filterStudents()">
                        <input type="hidden" id="studentId">
                        <div class="student-list" id="studentList">
                            <div class="student-list-header">
                                <span>Saved Info</span>
                                <span style="cursor: pointer;" onclick="closeStudentList()">✕</span>
                            </div>
                            <div id="studentItems"></div>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Student ID / Roll Number</label>
                        <input type="text" id="rollNumber" placeholder="e.g., 20CE1001">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Department</label>
                        <input type="text" id="department" placeholder="e.g., CSE">
                    </div>
                    <div class="form-field">
                        <label>Percentage / GPA</label>
                        <input type="text" id="cgpa" placeholder="e.g., 9.2 or 82.5%">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Year of Passing</label>
                        <input type="text" id="year" placeholder="e.g., 2024">
                    </div>
                    <div class="form-field">
                        <label>Grade / Division</label>
                        <select id="grade">
                            <option value="">Select Grade</option>
                            <option value="First Class with Distinction">First Class with Distinction</option>
                            <option value="First Class">First Class</option>
                            <option value="Second Class">Second Class</option>
                            <option value="Pass">Pass</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Course Name</label>
                        <input type="text" id="courseName" placeholder="e.g., B.Tech Computer Science">
                    </div>
                    <div class="form-field">
                        <label>University</label>
                        <input type="text" id="university" placeholder="e.g., IEEE University">
                    </div>
                </div>

                <div class="file-field">
                    <label>Certificate File</label>
                    <div class="file-row">
                        <button type="button" class="file-btn"
                            onclick="document.getElementById('certFile').click()">Choose File</button>
                        <span class="file-name" id="certFileName">No file chosen</span>
                        <input type="file" id="certFile" accept=".pdf,.jpg,.png" style="display: none;"
                            onchange="updateFileName('certFile', 'certFileName')">
                    </div>
                </div>

                <div class="file-field">
                    <label>Student Photo (REQUIRED)</label>
                    <div class="file-row">
                        <button type="button" class="file-btn"
                            onclick="document.getElementById('photoFile').click()">Choose File</button>
                        <span class="file-name" id="photoFileName">No file chosen</span>
                        <input type="file" id="photoFile" accept=".jpg,.png,.jpeg" style="display: none;"
                            onchange="updateFileName('photoFile', 'photoFileName')" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Issue Certificate & Register Hash
                </button>
            </form>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        const token = localStorage.getItem('token');

        if (!user || user.role !== 'admin') {
            location.href = '/login.html';
        }

        let students = [];

        async function loadStudents() {
            try {
                const res = await fetch('/api/auth/students', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                students = await res.json();
                renderStudentList();
            } catch (err) {
                console.error('Failed to load students:', err);
            }
        }

        function renderStudentList(filtered = null) {
            const list = filtered || students;
            const container = document.getElementById('studentItems');
            container.innerHTML = list.map(s => `
                <div class="student-item" onclick="selectStudent('${s._id}', '${s.name}', '${s.rollNumber}', '${s.department || ''}')">
                    ${s.name}
                </div>
            `).join('');
        }

        function toggleStudentList() {
            document.getElementById('studentList').classList.toggle('show');
        }

        function closeStudentList() {
            document.getElementById('studentList').classList.remove('show');
        }

        function filterStudents() {
            const query = document.getElementById('studentSearch').value.toLowerCase();
            const filtered = students.filter(s => s.name.toLowerCase().includes(query));
            renderStudentList(filtered);
            document.getElementById('studentList').classList.add('show');
        }

        function selectStudent(id, name, rollNumber, department) {
            document.getElementById('studentId').value = id;
            document.getElementById('studentSearch').value = name;
            document.getElementById('rollNumber').value = rollNumber;
            document.getElementById('department').value = department;
            closeStudentList();
        }

        function updateFileName(inputId, displayId) {
            const input = document.getElementById(inputId);
            const display = document.getElementById(displayId);
            if (input.files.length > 0) {
                display.textContent = input.files[0].name;
            } else {
                display.textContent = 'No file chosen';
            }
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.student-dropdown')) {
                closeStudentList();
            }
        });

        document.getElementById('issueForm').onsubmit = async (e) => {
            e.preventDefault();

            let studentId = document.getElementById('studentId').value;
            const studentSearch = document.getElementById('studentSearch').value;
            
            if (!studentId && !studentSearch) {
                alert('Please provide a Student Name');
                return;
            }

            const photoFile = document.getElementById('photoFile').files[0];
            if (!photoFile) {
                alert('Student photo is required');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Registering on Blockchain...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('studentId', studentId);
            formData.append('studentSearch', studentSearch);
            formData.append('rollNumber', document.getElementById('rollNumber').value);
            formData.append('courseName', document.getElementById('courseName').value);
            formData.append('university', document.getElementById('university').value);
            formData.append('department', document.getElementById('department').value);
            formData.append('year', document.getElementById('year').value);
            formData.append('grade', document.getElementById('grade').value);
            formData.append('cgpa', document.getElementById('cgpa').value);

            if (document.getElementById('certFile').files[0]) {
                formData.append('certificate', document.getElementById('certFile').files[0]);
            }
            formData.append('photo', photoFile);

            try {
                const res = await fetch('/api/certificates/issue', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                const result = await res.json();
                if (res.ok) {
                    alert('Certificate issued successfully!\nHash: ' + (result.txHash || result.certificateId));
                    
                    // Automatically generate and open the certificate page!
                    const certUrl = `/certificate_template.html?name=${encodeURIComponent(document.getElementById('studentSearch').value)}&course=${encodeURIComponent(document.getElementById('courseName').value || 'Bachelor of Technology')}&university=${encodeURIComponent(document.getElementById('university').value || 'IEEE Xpert Global University')}&print=true`;
                    window.open(certUrl, '_blank');

                    location.href = '/admin/index.html';
                } else {
                    alert('Error: ' + (result.error || 'Failed to issue certificate'));
                }
            } catch (err) {
                console.error(err);
                alert('Connection failure');
            } finally {
                btn.innerText = 'Issue Certificate & Register Hash';
                btn.disabled = false;
            }
        };

        loadStudents();
    </script>
</body>

</html>
