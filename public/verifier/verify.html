<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - Certificate Chain</title>
    <meta name="description" content="Instantly validate a certificate's authenticity on the blockchain.">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0d9488 0%, #0891b2 50%, #0e7490 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .verify-card {
            background: linear-gradient(180deg, #ec4899 0%, #f97316 50%, #eab308 100%);
            border-radius: 32px;
            padding: 3rem;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .verify-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .verify-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: white;
            margin-bottom: 0.75rem;
            letter-spacing: -0.03em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .verify-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .divider {
            border: none;
            border-top: 2px dashed rgba(255, 255, 255, 0.4);
            margin: 2rem 0;
        }

        .scan-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .scan-btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            border: none;
            background: white;
            color: #333;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .scan-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .manual-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
        }

        .hash-input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
            font-family: monospace;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .hash-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .hash-input:focus {
            border-color: white;
            background: rgba(255, 255, 255, 0.25);
        }

        .verify-btn {
            width: 100%;
            padding: 1.3rem;
            border-radius: 12px;
            border: none;
            background: white;
            color: #333;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .verify-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .verify-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* QR Display Area */
        .qr-preview {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin: 1.5rem auto;
            max-width: 280px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .qr-preview img {
            width: 100%;
            display: block;
            border-radius: 8px;
        }

        .qr-preview .brand {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            font-weight: 800;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        /* Camera scanner */
        #reader-container {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            margin: 1.5rem auto;
            max-width: 320px;
            position: relative;
        }

        .scanner-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            bottom: 1rem;
            border: 3px solid #ec4899;
            border-radius: 12px;
            pointer-events: none;
            z-index: 10;
        }

        .scanner-line {
            position: absolute;
            left: 1rem;
            right: 1rem;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ec4899, transparent);
            animation: scanLine 2s linear infinite;
            z-index: 11;
        }

        @keyframes scanLine {
            0% {
                top: 1rem;
            }

            50% {
                top: calc(100% - 1rem);
            }

            100% {
                top: 1rem;
            }
        }

        /* File upload */
        .upload-input {
            display: none;
        }

        /* Result panel */
        .result-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            margin-top: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .result-badge {
            display: inline-block;
            padding: 0.8rem 2rem;
            border-radius: 100px;
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .result-badge.valid {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .result-badge.invalid {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        .detail-grid {
            display: grid;
            gap: 1.5rem;
        }

        .detail-item label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .detail-item .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
        }

        .detail-item .value.hash {
            font-family: monospace;
            font-size: 0.85rem;
            color: #3b82f6;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <nav style="background: transparent; border: none;">
        <div class="logo" style="color: white;">Certificate Chain</div>
        <a href="/" class="btn"
            style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;">← Back
            Home</a>
    </nav>

    <div class="container animate-fade"
        style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div style="width: 100%; max-width: 700px;">
            <div class="verify-card">
                <h1 class="verify-title">Certificate Verification</h1>
                <p class="verify-subtitle">Instantly validate a certificate's authenticity on the blockchain.</p>

                <hr class="divider">

                <!-- QR Preview Area (shown when QR uploaded/scanned) -->
                <div id="qr-preview" class="qr-preview" style="display: none;">
                    <img id="qr-image" src="" alt="QR Code">
                    <div class="brand">✦ TQRCG</div>
                </div>

                <!-- Camera Scanner -->
                <div id="reader-container" style="display: none;">
                    <div id="reader"></div>
                    <div class="scanner-overlay"></div>
                    <div class="scanner-line"></div>
                </div>

                <!-- Scan Buttons -->
                <div class="scan-buttons" id="scan-buttons">
                    <button class="scan-btn" onclick="startCamera()">
                        📷 Scan with Camera
                    </button>
                    <button class="scan-btn" onclick="document.getElementById('qr-upload').click()">
                        📤 Upload QR Image
                    </button>
                    <input type="file" id="qr-upload" class="upload-input" accept="image/*"
                        onchange="handleQRUpload(event)">
                </div>

                <!-- Manual Entry -->
                <p class="manual-label">OR ENTER MANUALLY</p>
                <input type="text" id="verifyId" class="hash-input" placeholder="Enter Certificate Hash (e.g., 0x...)">

                <button class="verify-btn" id="verify-btn" onclick="verify()">
                    Verify Certificate
                </button>

                <button id="cancel-scan" class="scan-btn"
                    style="display: none; margin: 1rem auto 0; background: rgba(255,255,255,0.2); color: white;"
                    onclick="stopCamera()">
                    ✕ Cancel Scan
                </button>
            </div>

            <!-- Results -->
            <div id="result" class="result-card" style="display: none;">
                <div style="text-align: center;">
                    <div id="result-badge" class="result-badge"></div>
                </div>
                <div id="result-details" class="detail-grid"></div>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode = null;

        function startCamera() {
            document.getElementById('reader-container').style.display = 'block';
            document.getElementById('scan-buttons').style.display = 'none';
            document.getElementById('cancel-scan').style.display = 'block';
            document.getElementById('qr-preview').style.display = 'none';

            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).catch(err => {
                console.error("Camera error:", err);
                alert("Could not access camera. Please upload a QR image instead.");
                stopCamera();
            });
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').style.display = 'none';
                    document.getElementById('scan-buttons').style.display = 'flex';
                    document.getElementById('cancel-scan').style.display = 'none';
                }).catch(err => console.error(err));
            }
        }

        function onScanSuccess(decodedText) {
            stopCamera();
            try {
                // Try to parse as URL
                const url = new URL(decodedText);
                const id = url.searchParams.get("id");
                if (id) {
                    document.getElementById('verifyId').value = id;
                    verify();
                    return;
                }
            } catch (e) {
                // Not a URL, use as-is (could be certificate hash)
            }
            document.getElementById('verifyId').value = decodedText;
            verify();
        }

        function onScanError(error) {
            // Ignore scan errors (continuous scanning)
        }

        function handleQRUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Show preview
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('qr-image').src = e.target.result;
                document.getElementById('qr-preview').style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Decode QR
            const html5QrCodeScanner = new Html5Qrcode("reader");
            html5QrCodeScanner.scanFile(file, true)
                .then(decodedText => {
                    try {
                        const url = new URL(decodedText);
                        const id = url.searchParams.get("id");
                        if (id) {
                            document.getElementById('verifyId').value = id;
                            return;
                        }
                    } catch (e) { }
                    document.getElementById('verifyId').value = decodedText;
                })
                .catch(err => {
                    console.error("QR decode error:", err);
                    alert("Could not read QR code from image. Please try another image or enter manually.");
                });
        }

        async function verify() {
            const id = document.getElementById('verifyId').value.trim();
            if (!id) {
                alert('Please enter a Certificate Hash or scan a QR code');
                return;
            }

            const btn = document.getElementById('verify-btn');
            btn.innerText = 'Verifying on Blockchain...';
            btn.disabled = true;

            const resultDiv = document.getElementById('result');
            const badge = document.getElementById('result-badge');
            const details = document.getElementById('result-details');

            try {
                const res = await fetch(`/api/certificates/verify/${encodeURIComponent(id)}`);
                const data = await res.json();

                resultDiv.style.display = 'block';

                if (res.ok) {
                    // Celebration!
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#10b981', '#3b82f6', '#ffffff']
                    });

                    badge.className = 'result-badge valid';
                    badge.innerHTML = '✅ VALID - Certificate Verified';

                    details.innerHTML = `
                        <div class="detail-item">
                            <label>Certificate Holder</label>
                            <div class="value" style="font-size: 1.5rem;">${data.studentName}</div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="detail-item">
                                <label>Roll Number</label>
                                <div class="value" style="color: #3b82f6;">#${data.rollNumber}</div>
                            </div>
                            <div class="detail-item">
                                <label>Department</label>
                                <div class="value">${data.department || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="detail-item">
                            <label>Course / Credential</label>
                            <div class="value">${data.courseName}</div>
                        </div>
                        <div class="detail-item">
                            <label>Issuing Institution</label>
                            <div class="value" style="opacity: 0.8;">${data.university}</div>
                        </div>
                        ${data.isPrivate ? `
                        <div style="padding: 1rem; background: rgba(59, 130, 246, 0.15); border-radius: 12px; color: #60a5fa; font-size: 0.85rem; border: 1px solid rgba(59, 130, 246, 0.3); display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem;">
                            <span style="font-size: 1.2rem;">🛡️</span>
                            <div>
                                <strong style="display: block; color: white;">Selective Disclosure Active</strong>
                                Some sensitive metadata has been redacted by the student for privacy.
                            </div>
                        </div>
                        ` : ''}
                        <div class="detail-item">
                            <label>Blockchain Transaction Hash</label>
                            <div class="value hash">${data.txHash || 'N/A'}</div>
                        </div>
                        <div class="detail-item">
                            <label>Issue Date</label>
                            <div class="value" style="opacity: 0.7;">${new Date(data.issueDate).toLocaleDateString()}</div>
                        </div>
                        ${data.isRevoked ? '<div style="padding: 1rem; background: rgba(239, 68, 68, 0.2); border-radius: 12px; color: #ef4444; font-weight: 700; text-align: center; border: 1px solid rgba(239, 68, 68, 0.3);">⚠️ WARNING: This certificate has been REVOKED</div>' : ''}
                    `;
                } else {
                    badge.className = 'result-badge invalid';
                    badge.innerHTML = '❌ INVALID - Certificate Not Found';
                    details.innerHTML = '<p style="text-align: center; opacity: 0.6;">No matching certificate found on the blockchain for this ID.</p>';
                }

                resultDiv.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                alert('Connection to blockchain gateway failed. Please try again.');
            } finally {
                btn.innerText = 'Verify Certificate';
                btn.disabled = false;
            }
        }

        // Auto-verify if ID in URL
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                document.getElementById('verifyId').value = id;
                verify();
            }
        };
    </script>
</body>

</html>
